info:
  name: GETSingleCustomer
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/customer/{{id}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", ()=>
          expect(res.status).to.equal(200));  

        test("Content Type", ()=>{
          expect(res.headers["content-type"]).to.equal("application/json");
        });

        test("Server name", ()=>{
          expect(res.headers["server"]).to.equal("Heroku");
        });

        test("Powered by", ()=>{
          expect(res.headers["x-powered-by"]).to.equal("Express")
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
